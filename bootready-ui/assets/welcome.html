<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #fff;
    color: #1a1a1a;
    padding: 10px 14px 8px;
  }
  h1 { font-size: 14px; font-weight: 700; color: #1d9e75; margin-bottom: 3px; }
  .sub { font-size: 11px; color: #666; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  td {
    width: 50%;
    background: #f8faf9;
    border: 1px solid #e8f3ef;
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 600;
    color: #111;
    vertical-align: middle;
  }
  .notice { font-size: 10px; color: #999; border-top: 1px solid #eee; padding-top: 6px; }
</style>
</head>
<body>
  <h1>BootReady</h1>
  <p class="sub">부팅 속도를 기록하고, 무엇이 느리게 만드는지 알려드립니다.</p>
  <table>
    <tr>
      <td>⏱ 부팅 시간 자동 측정</td>
      <td>📊 프로그램별 지연 분석</td>
    </tr>
    <tr>
      <td>🔔 트레이 상주, 방해 없음</td>
      <td>🔒 데이터는 내 PC에만</td>
    </tr>
  </table>
  <p class="notice">설치를 계속하면 Windows 시작 프로그램으로 등록됩니다. 설정에서 언제든지 해제할 수 있습니다.</p>
  <p class="notice" style="margin-top:5px; color:#b45309;">⚠ 설치 시 Windows 보안 경고가 뜰 수 있습니다. <b>"추가 정보" → "실행"</b>을 클릭하면 계속할 수 있습니다.</p>
</body>
</html>
