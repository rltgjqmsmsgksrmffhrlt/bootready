name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build boot-core
        working-directory: boot-core
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bootready-ui/package-lock.json

      - name: Install dependencies
        working-directory: bootready-ui
        run: npm ci

      - name: Create icon.icns (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p icon.iconset
          sips -z 16 16   bootready-ui/assets/icon-16.png  --out icon.iconset/icon_16x16.png
          sips -z 32 32   bootready-ui/assets/icon-32.png  --out icon.iconset/icon_32x32.png
          sips -z 48 48   bootready-ui/assets/icon-48.png  --out icon.iconset/icon_48x48.png
          sips -z 128 128 bootready-ui/assets/icon-256.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 bootready-ui/assets/icon-256.png --out icon.iconset/icon_256x256.png
          iconutil -c icns icon.iconset -o bootready-ui/assets/icon.icns

      - name: Build Electron app
        working-directory: bootready-ui
        run: |
          npm run build -- ${{ matrix.os == 'windows-latest' && '--win' || matrix.os == 'macos-latest' && '--mac' || '--linux' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            bootready-ui/release/*.exe
            bootready-ui/release/*.dmg
            bootready-ui/release/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## BootReady ${{ github.ref_name }}

            ### 다운로드
            | 플랫폼 | 파일 |
            |--------|------|
            | Windows | `BootReady-Setup-*.exe` |
            | macOS | `BootReady-*.dmg` |
            | Linux | `BootReady-*.AppImage` |

            ---

            ### ⚠ 설치 전 주의사항

            **Windows — SmartScreen 경고**
            > 설치 파일 실행 시 "Windows에서 PC를 보호했습니다" 메시지가 뜰 수 있습니다.
            > **"추가 정보" → "실행"** 을 클릭하면 설치가 계속됩니다.

            **macOS — Gatekeeper 경고**
            > "개발자를 확인할 수 없습니다" 메시지가 뜨면:
            > **Finder에서 앱 우클릭 → "열기" → "열기"** 를 선택하세요.
            > (최초 1회만 필요합니다)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
