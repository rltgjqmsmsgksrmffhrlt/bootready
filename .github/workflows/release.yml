name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build boot-core
        working-directory: boot-core
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bootready-ui/package-lock.json

      - name: Install dependencies
        working-directory: bootready-ui
        run: npm ci

      - name: Build Electron app
        working-directory: bootready-ui
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bootready-ui/release/*.exe
          body: |
            ## BootReady ${{ github.ref_name }}

            > Windows 전용 앱입니다. 부팅 속도를 기록하고, 무엇이 느리게 만드는지 알려드립니다.

            ### 다운로드
            `BootReady-Setup-*.exe` 파일을 다운받아 실행하세요.

            ---

            ### ⚠ 설치 전 주의사항

            **Windows SmartScreen 경고가 뜰 수 있습니다**
            > 설치 파일 실행 시 "Windows에서 PC를 보호했습니다" 메시지가 뜨면
            > **"추가 정보" → "실행"** 을 클릭하면 설치가 계속됩니다.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
